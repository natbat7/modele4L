<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurateur Renault 4L — N&C 2028</title>
    <style>
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #12151b;
        }

        /* STRUCTURE GLOBALE : MENU À GAUCHE, 3D À DROITE */
        .layout {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* PANNEAU DE CONTRÔLE (FORMULAIRE) */
        #ui {
            width: 320px;
            height: 100%;
            background: #1d2229;
            border-right: 1px solid #c9a063;
            padding: 25px 20px;
            overflow-y: auto;
            color: #f3efe4;
            z-index: 10;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* ZONE 3D (SAHARA + 4L) */
        #canvas-container {
            flex: 1;
            height: 100%;
            position: relative;
            background-image: url('https://raw.githubusercontent.com/natbat7/modele4L/main/desert.jpg');
            background-size: cover;
            background-position: center;
        }

        h2 { 
            margin-top: 0; 
            font-size: 22px; 
            color: #c9a063; 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        input[type="file"] { display: none; }
        
        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin-bottom: 15px;
            background: #c8402e;
            color: white;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .custom-file-upload:hover { background: #a83222; transform: translateY(-1px); }

        label.slider-title { 
            display: block; 
            margin-top: 15px; 
            font-weight: 600; 
            font-size: 13px; 
            color: #c9a063; 
            text-transform: uppercase;
        }
        
        input[type="range"] { 
            width: 100%; 
            margin-top: 8px; 
            cursor: pointer; 
            accent-color: #c9a063;
        }

        /* BOUTON TÉLÉCHARGER LA PHOTO */
        button.screenshot-btn {
            width: 100%; 
            margin-top: 25px; 
            padding: 14px; 
            border: 1px solid #c9a063;
            border-radius: 8px; 
            background: #252b34; 
            color: #f3efe4;
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button.screenshot-btn:hover { background: #c9a063; color: #1d2229; }

        /* BOUTON SUPPRIMER LE LOGO */
        button.remove-btn {
            width: 100%; 
            margin-top: 10px; 
            padding: 10px; 
            border: none;
            border-radius: 8px; 
            background: transparent; 
            color: #b0aba0;
            cursor: pointer; 
            font-size: 13px; 
            text-decoration: underline; 
            transition: color 0.3s;
        }
        button.remove-btn:hover { color: #e53e3e; }

        .info { 
            margin: 10px 0; 
            font-size: 13px; 
            color: #b0aba0; 
            line-height: 1.6; 
            background: rgba(0,0,0,0.25);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #c9a063;
        }

        /* ---- ADAPTATION SMARTPHONE : 3D EN HAUT, FORMULAIRE EN BAS ---- */
        @media (max-width: 768px) {
            .layout {
                flex-direction: column-reverse; /* Met le canvas en haut et le formulaire en bas */
            }
            #canvas-container {
                width: 100%;
                height: 55vh; /* 55% de l'écran pour la 4L */
            }
            #ui {
                width: 100%;
                height: 45vh; /* 45% de l'écran pour les contrôles */
                border-right: none;
                border-top: 1px solid #c9a063;
                padding: 15px 20px;
            }
            h2 { font-size: 18px; margin-bottom: 10px; }
            .info { display: none; } /* Masqué sur mobile pour gagner de la place */
            button.screenshot-btn { margin-top: 15px; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
</head>

<body>
    <div class="layout">
        <!-- PANNEAU DE CONTRÔLE (FORMULAIRE) -->
        <div id="ui">
            <h2>Configurateur 4L</h2>
            
            <label for="logoInput" class="custom-file-upload">
                📷 Importer un logo
            </label>
            <input type="file" id="logoInput" accept="image/*">

            <div class="info">
                1) Choisissez un logo<br>
                2) Cliquez sur la carrosserie<br>
                3) Ajustez sa taille et sa rotation
            </div>

            <label class="slider-title">Taille du logo</label>
            <input id="sizeRange" type="range" min="0.1" max="2" step="0.01" value="0.5">

            <label class="slider-title">Rotation</label>
            <input id="rotRange" type="range" min="-3.14" max="3.14" step="0.01" value="0">

            <!-- LE BOUTON RESTE DANS LE FORMULAIRE -->
            <button id="screenshotBtn" class="screenshot-btn">📸 Télécharger ma photo</button>

            <button id="removeBtn" class="remove-btn">Supprimer le logo</button>
        </div>

        <!-- ZONE 3D SANS AUCUN BLOC PAR-DESSUS -->
        <div id="canvas-container"></div>
    </div>

    <!-- LA FENÊTRE DE RECADRAGE -->
    <div id="cropModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; flex-direction:column;">
        <div style="background:#1d2229; border: 1px solid #c9a063; padding:20px; border-radius:12px; width:90%; max-width:500px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); color: #f3efe4;">
            <h3 style="margin-top:0; text-align:center; color:#c9a063; text-transform: uppercase;">Recadrer le logo</h3>
            
            <div style="max-height: 50vh; overflow: hidden; background:#12151b; margin-bottom:15px; border-radius: 6px;">
                <img id="imageToCrop" style="max-width: 100%; display:block;">
            </div>
            
            <div style="display:flex; justify-content:space-between; gap:10px;">
                <button id="cancelCropBtn" style="flex:1; padding:10px; background:#252b34; color:#f3efe4; border:1px solid #777; border-radius:8px; font-weight:bold; cursor:pointer;">Annuler</button>
                <button id="applyCropBtn" style="flex:1; padding:10px; background:#c8402e; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Valider</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/geometries/DecalGeometry.js"></script>
    <script src="main.js"></script>
</body>
</html>
