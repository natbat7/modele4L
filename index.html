<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Configurateur Renault 4L</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* IMAGE DE FOND FIXE */
            background-image: url('https://raw.githubusercontent.com/natbat7/modele4L/main/desert.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 260px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        h2 { margin-top: 0; font-size: 22px; color: #222; text-align: center; }

        /* Le nouveau design du bouton de fichier */
        input[type="file"] { display: none; }
        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin-bottom: 15px;
            background: #2b6cb0;
            color: white;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            box-sizing: border-box;
        }
        .custom-file-upload:hover { background: #2c5282; }

        label.slider-title { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; color: #444; }
        input[type="range"] { width: 100%; margin-top: 8px; cursor: pointer; }

        button.remove-btn {
            width: 100%; margin-top: 25px; padding: 12px; border: none;
            border-radius: 8px; background: #e53e3e; color: white;
            cursor: pointer; font-weight: bold; transition: background 0.3s;
        }
        button.remove-btn:hover { background: #c53030; }

        .info { margin-top: 10px; font-size: 13px; color: #555; line-height: 1.6; }


        /* ---- ADAPTATION SMARTPHONE ---- */
        @media (max-width: 768px) {
            #ui {
                top: auto; /* Annule l'ancrage en haut */
                bottom: 15px; /* Colle le menu en bas */
                left: 50%;
                transform: translateX(-50%); /* Le centre parfaitement */
                width: 90%; /* Prend la largeur de l'écran avec une marge */
                max-width: 350px;
                padding: 15px;
                max-height: 45vh; /* Ne dépasse pas la moitié de l'écran */
                overflow-y: auto; /* Permet de scroller dans le petit menu si besoin */
            }
            
            #ui h2 { 
                font-size: 18px; 
                margin-bottom: 10px; 
            }
            
            .info { 
                display: none; /* On cache le texte d'aide pour libérer l'écran */
            }
            
            .custom-file-upload { 
                padding: 10px 0; 
                margin-bottom: 10px; 
                font-size: 14px; 
            }
            
            button.remove-btn { 
                padding: 10px; 
                margin-top: 15px; 
                font-size: 14px; 
            }
            
            label.slider-title { 
                margin-top: 10px; 
            }
        }

        
    </style>
<!-- LIBRAIRIE CROPPER.JS (CSS) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
</head>

<body>
    <div id="ui">
        <h2>Configurateur 4L</h2>
        
        <!-- Bouton masqué remplacé par un label stylisé -->
        <label for="logoInput" class="custom-file-upload">
            📷 Importer un logo
        </label>
        <input type="file" id="logoInput" accept="image/*">

        <div class="info">
            1) Choisissez un logo<br>
            2) Cliquez sur la carrosserie<br>
            3) Ajustez sa taille et rotation
        </div>

        <label class="slider-title">Taille du logo</label>
        <input id="sizeRange" type="range" min="0.1" max="2" step="0.01" value="0.5">

        <label class="slider-title">Rotation</label>
        <input id="rotRange" type="range" min="-3.14" max="3.14" step="0.01" value="0">

        <button id="removeBtn" class="remove-btn">Supprimer le logo</button>
    </div>
<!-- LA FENÊTRE DE RECADRAGE (Cachée par défaut) -->
    <div id="cropModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center; flex-direction:column;">
        <div style="background:white; padding:20px; border-radius:12px; width:90%; max-width:500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h3 style="margin-top:0; text-align:center; color:#222;">Recadrer le logo</h3>
            
            <!-- Zone où l'image va s'afficher -->
            <div style="max-height: 50vh; overflow: hidden; background:#eee; margin-bottom:15px;">
                <img id="imageToCrop" style="max-width: 100%; display:block;">
            </div>
            
            <!-- Boutons de validation -->
            <div style="display:flex; justify-content:space-between; gap:10px;">
                <button id="cancelCropBtn" style="flex:1; padding:10px; background:#e53e3e; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Annuler</button>
                <button id="applyCropBtn" style="flex:1; padding:10px; background:#38a169; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Valider</button>
            </div>
        </div>
    </div>

    <!-- LIBRAIRIE CROPPER.JS (JS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- LIBRAIRIES THREE.JS -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/geometries/DecalGeometry.js"></script>
    <script src="main.js"></script>
</body>
</html>
